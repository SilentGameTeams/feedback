name: 缺陷报告 / Bug report
description: 提交程序、服务或协议解析缺陷；安全漏洞请勿公开提交。
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先搜索已有 issue。
        安全漏洞请勿在此公开提交，请发送至 SilentStudio@feedback.email.cn。
        Do not report security vulnerabilities in public issues.
  - type: dropdown
    id: feedback_language
    attributes:
      label: 反馈语言 / Feedback language
      description: 选择你希望我们回复时使用的语言。
      options:
        - 简体中文
        - English
        - Español
        - Français
        - Deutsch
        - Русский
        - 日本語
        - 한국어
        - العربية
        - Português
        - Italiano
        - हिन्दी
        - ไทย
        - Tiếng Việt
        - Bahasa Indonesia
        - Türkçe
        - Nederlands
    validations:
      required: true
  - type: input
    id: project
    attributes:
      label: 项目 / Project
      description: 已登记项目请填写项目名；未登记项目请直接填写项目名或 feedback 目录名。
      placeholder: 项目名或目录名
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本或 commit / Version
      placeholder: v0.1.0 或 commit hash
  - type: dropdown
    id: os
    attributes:
      label: 操作系统 / Operating system
      description: 必选。
      options:
        - macOS
        - Windows
        - Linux
        - 其他 / Other
    validations:
      required: true
  - type: input
    id: os_version
    attributes:
      label: 操作系统版本 / OS version
      description: 必填，例如 macOS 15.1、Windows 11 24H2、Ubuntu 24.04。
      placeholder: macOS 15.1
    validations:
      required: true
  - type: markdown
    attributes:
      value: "---"
  - type: dropdown
    id: severity
    attributes:
      label: 严重程度 / Severity
      description: 选择影响等级；CVSS 评分可在下一项填写。
      options:
        - S1 - 严重 / Critical
        - S2 - 高 / High
        - S3 - 中 / Medium
        - S4 - 低 / Low
    validations:
      required: true
  - type: input
    id: cvss
    attributes:
      label: CVSS 向量或评分（可选）
      description: 例如 CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H 或 9.8；可用 https://www.first.org/cvss/calculator/3.1 计算。安全漏洞请走安全邮箱，不要公开利用细节。
      placeholder: CVSS:3.1/...
  - type: input
    id: summary
    attributes:
      label: 问题摘要 / Summary
      description: 一句话说明问题。
      placeholder: 简短描述
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      description: 请按顺序列出最小复现步骤。
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果 / Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果 / Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 其他环境 / Other environment
      description: 架构、协议、方向或部署方式（如适用）。
      placeholder: arm64, C->S, TLS, local
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图 / Logs or screenshots
      description: 不要包含密钥、令牌、个人数据或未授权的测试细节。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认 / Checklist
      options:
        - label: 我已搜索过已有 issue。
          required: true
        - label: 我没有包含密钥、令牌或个人数据。
          required: true
        - label: 我没有在公开 issue 中披露安全漏洞细节。
          required: true
