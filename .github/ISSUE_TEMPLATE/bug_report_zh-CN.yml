name: 缺陷报告
description: 提交程序、服务或协议解析缺陷。
title: '[Bug] '
body:
- type: markdown
  attributes:
    value: '> 安全漏洞请勿公开提交，请发送至 SilentStudio@feedback.email.cn。

      >

      > **反馈语言：简体中文**'
- type: markdown
  attributes:
    value: '---

      ## 基本信息'
- type: input
  id: project
  attributes:
    label: 项目
    placeholder: 项目名或目录名
  validations:
    required: true
- type: input
  id: version
  attributes:
    label: 版本或 commit
    placeholder: v0.1.0 或 commit
- type: dropdown
  id: os
  attributes:
    label: 操作系统
    options:
    - macOS
    - Windows
    - Linux
    - 其他
  validations:
    required: true
- type: input
  id: os_version
  attributes:
    label: 操作系统版本
    placeholder: macOS 15.1
  validations:
    required: true
- type: markdown
  attributes:
    value: '---

      ## 影响'
- type: dropdown
  id: severity
  attributes:
    label: 严重程度
    options:
    - S1 - 严重
    - S2 - 高
    - S3 - 中
    - S4 - 低
  validations:
    required: true
- type: input
  id: cvss
  attributes:
    label: CVSS 向量或评分（可选）
    placeholder: CVSS:3.1/...
- type: input
  id: summary
  attributes:
    label: 问题摘要
    placeholder: 简短描述
  validations:
    required: true
- type: markdown
  attributes:
    value: '---

      ## 复现'
- type: textarea
  id: steps
  attributes:
    label: 复现步骤
  validations:
    required: true
- type: textarea
  id: expected
  attributes:
    label: 期望结果
  validations:
    required: true
- type: textarea
  id: actual
  attributes:
    label: 实际结果
  validations:
    required: true
- type: markdown
  attributes:
    value: '---

      ## 补充'
- type: textarea
  id: environment
  attributes:
    label: 其他环境
    placeholder: arm64, C->S, TLS
- type: textarea
  id: logs
  attributes:
    label: 日志或截图
- type: markdown
  attributes:
    value: '---

      ## 确认'
- type: checkboxes
  id: checks
  attributes:
    label: 提交前确认
    options:
    - label: 我已搜索过已有 issue。
      required: true
    - label: 我没有包含密钥、令牌或个人数据。
      required: true
    - label: 我没有在公开 issue 中披露安全漏洞细节。
      required: true
