name: Sync project list

on:
  push:
    branches: [main]
    paths:
      - '*/**'
      - 'scripts/generate_projects.py'
      - 'docs/projects.json'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate project list
        run: python scripts/generate_projects.py
      - name: Commit generated list
        run: |
          if git diff --quiet -- docs/projects.json; then
            echo "project list already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/projects.json
          git commit -m "chore: sync feedback project list"
          git push
