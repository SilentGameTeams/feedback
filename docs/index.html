<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="assets/icons/globe.svg">
<title>Silent Game Feedback · 反馈入口</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f8fa;
    --card: #ffffff;
    --text: #1f2328;
    --muted: #59636e;
    --border: #d1d9e0;
    --accent: #0969da;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --card: #151b23;
      --text: #f0f6fc;
      --muted: #9198a1;
      --border: #3d444d;
      --accent: #4493f8;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  main { max-width: 980px; margin: 0 auto; padding: 48px 24px 64px; }
  .eyebrow {
    margin: 0 0 6px;
    color: var(--muted);
    font-size: 13px;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  h1 { margin: 0; font-size: 32px; line-height: 1.2; letter-spacing: -0.01em; }
  h2 { margin: 0; font-size: 20px; line-height: 1.3; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .subtitle { margin: 12px 0 0; max-width: 720px; color: var(--muted); font-size: 15px; }
  .brand-icon, .card-icon {
    display: inline-block;
    background: currentColor;
    -webkit-mask: var(--icon) center / contain no-repeat;
    mask: var(--icon) center / contain no-repeat;
  }
  .brand-icon {
    width: 14px;
    height: 14px;
    margin-right: 6px;
    vertical-align: -2px;
    --icon: url("assets/icons/globe.svg");
  }
  .card-icon {
    width: 18px;
    height: 18px;
    flex: 0 0 18px;
    color: var(--muted);
    --icon: var(--card-icon);
  }
  .card:hover .card-icon { color: var(--accent); }
  .progress {
    position: fixed;
    top: 0;
    left: 0;
    width: 0;
    height: 3px;
    background: var(--accent);
    opacity: 0;
    z-index: 100;
    transition: width 260ms ease, opacity 160ms ease;
    pointer-events: none;
  }
  .view { display: none; }
  .view.is-active { display: block; animation: viewIn 300ms cubic-bezier(.2, .8, .2, 1) both; }
  .view.is-leaving { display: block; animation: viewOut 170ms ease both; }
  @keyframes viewIn {
    from { opacity: 0; transform: translateX(18px); }
    to { opacity: 1; transform: translateX(0); }
  }
  @keyframes viewOut {
    from { opacity: 1; transform: translateX(0); }
    to { opacity: 0; transform: translateX(-18px); }
  }
  .language-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; }
  .lang {
    appearance: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--card);
    color: var(--text);
    padding: 9px 13px;
    font: inherit;
    font-size: 14px;
    display: inline-block;
    text-decoration: none;
    cursor: pointer;
    animation: fadeUp 260ms ease both;
    animation-delay: calc(var(--i, 0) * 24ms);
    transition: transform 160ms ease, border-color 160ms ease;
  }
  .lang:hover { border-color: var(--accent); transform: translateY(-1px); }
  .lang:active { transform: translateY(0); }
  .lang.suggested { box-shadow: inset 0 0 0 2px var(--accent); }
  .lang:focus-visible, .card:focus-visible, button:focus-visible, a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .content-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    margin-top: 0;
  }
  #change {
    appearance: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--card);
    color: var(--text);
    padding: 8px 12px;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
    transition: transform 160ms ease, border-color 160ms ease;
  }
  #change:hover { border-color: var(--accent); transform: translateY(-1px); }
  .project-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 16px;
  }
  .project-row label {
    color: var(--muted);
    font-size: 13px;
    white-space: nowrap;
  }
  .project-row select {
    appearance: none;
    min-width: 220px;
    max-width: 100%;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--card);
    color: var(--text);
    padding: 8px 10px;
    font: inherit;
    font-size: 13px;
  }
  .project-row select:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 12px;
    margin-top: 18px;
  }
  .card {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 4px 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    color: var(--text);
    padding: 16px;
    text-decoration: none;
    animation: cardIn 300ms ease both;
    animation-delay: calc(var(--i, 0) * 45ms);
    transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12); }
  .card h3 { grid-column: 1; display: flex; align-items: center; gap: 8px; margin: 0; font-size: 16px; line-height: 1.3; }
  .card p { grid-column: 1; margin: 0; color: var(--muted); font-size: 13px; }
  .arrow { grid-column: 2; grid-row: 1 / span 2; align-self: center; color: var(--muted); font-size: 20px; }
  .note { margin: 18px 0 0; color: var(--muted); font-size: 13px; }
  .note a { color: var(--accent); }
  .security {
    margin: 36px 0 0;
    border-top: 1px solid var(--border);
    padding-top: 16px;
    color: var(--muted);
    font-size: 13px;
  }
  .security a { color: var(--accent); }
  noscript { display: block; margin-top: 24px; color: var(--muted); }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) {
    .lang, .card, .view { animation: none !important; transition: none !important; }
    .lang:hover, .card:hover, #change:hover { transform: none; }
  }
  @media (max-width: 640px) {
    main { padding: 28px 16px 48px; }
    h1 { font-size: 26px; }
    .content-head { flex-direction: column; }
  }
</style>
</head>
<body>
<div id="progress" class="progress" aria-hidden="true"></div>
<main>
  <section id="picker-view" class="view is-active">
    <header>
      <p class="eyebrow"><span class="brand-icon" aria-hidden="true"></span>Silent Game / feedback</p>
      <h1>选择语言</h1>
      <p class="subtitle">先选择语言，再进入对应的反馈表单。</p>
    </header>

    <section id="languages" class="language-grid" aria-label="Languages"></section>
  </section>

  <section id="content" class="view" hidden>
    <div class="content-head">
      <div>
        <p class="eyebrow" id="current-language"></p>
        <h2 id="choose-type">选择反馈类型</h2>
      </div>
      <button id="change" type="button">更改语言</button>
    </div>
    <div id="project-row" class="project-row" hidden>
      <label for="project-select" id="project-label">项目</label>
      <select id="project-select"></select>
    </div>
    <div id="cards" class="cards"></div>
    <p class="note"><span id="note-text">进入表单后请在第一项选择同一语言。</span></p>
    <p class="note"><a id="picker-link" href="https://github.com/SilentGameTeams/feedback/issues/new/choose">完整模板选择页</a> · <a id="guide-link" href="https://github.com/SilentGameTeams/feedback#readme">反馈说明</a></p>
  </section>

  <p class="security"><span id="security-text">安全漏洞请勿公开提交</span>: <a href="mailto:SilentStudio@feedback.email.cn">SilentStudio@feedback.email.cn</a></p>
  <noscript><p>请启用 JavaScript，或直接打开 <a href="https://github.com/SilentGameTeams/feedback/issues/new/choose">完整模板选择页</a>。</p></noscript>
</main>

  "th": { chooseType: "เลือกประเภทความคิดเห็น", change: "เปลี่ยนภาษา", note: "โปรดเลือกภาษาเดียวกันในช่องแรก", picker: "หน้าเลือกเทมเพลตทั้งหมด", guide: "คู่มือความคิดเห็น", security: "อย่าเปิดเผยช่องโหว่ด้านความปลอดภัย" },
  "vi": { chooseType: "Chọn loại phản hồi", change: "Đổi ngôn ngữ", note: "Chọn cùng ngôn ngữ ở trường đầu tiên.", picker: "Chọn mẫu đầy đủ", guide: "Hướng dẫn phản hồi", security: "Không công bố lỗ hổng bảo mật" },
  "id": { chooseType: "Pilih jenis umpan balik", change: "Ubah bahasa", note: "Pilih bahasa yang sama di bidang pertama.", picker: "Pemilih templat lengkap", guide: "Panduan umpan balik", security: "Jangan publikasikan kerentanan keamanan" },
  "tr": { chooseType: "Geri bildirim türünü seçin", change: "Dili değiştir", note: "İlk alanda aynı dili seçin.", picker: "Tam şablon seçici", guide: "Geri bildirim kılavuzu", security: "Güvenlik açıklarını herkese açık paylaşmayın" },
  "nl": { chooseType: "Kies een soort feedback", change: "Taal wijzigen", note: "Kies dezelfde taal in het eerste veld.", picker: "Volledige sjablonenkiezer", guide: "Feedbackgids", security: "Publiceer geen beveiligingskwetsbaarheden" }
};

var grid = document.getElementById("languages");
var pickerView = document.getElementById("picker-view");
var content = document.getElementById("content");
var cards = document.getElementById("cards");
var currentLanguage = document.getElementById("current-language");
var chooseType = document.getElementById("choose-type");
var changeButton = document.getElementById("change");
var noteText = document.getElementById("note-text");
var pickerLink = document.getElementById("picker-link");
var guideLink = document.getElementById("guide-link");
var securityText = document.getElementById("security-text");
var projectRow = document.getElementById("project-row");
var projectSelect = document.getElementById("project-select");
var projects = [];
var selectedProject = null;
var currentLanguageCode = "";
var progress = document.getElementById("progress");
var progressTimer = null;
var currentView = pickerView;
var prefersReducedMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var order = ["bug", "feature", "language", "question"];

function findLanguage(code) {
  for (var i = 0; i < LANGS.length; i++) {
    if (LANGS[i].code === code) {
      return LANGS[i];
    }
  }
  return null;
}

function browserLanguage() {
  var tags = navigator.languages || [navigator.language || ""];
  for (var i = 0; i < tags.length; i++) {
    var base = String(tags[i]).toLowerCase().split("-")[0];
    for (var j = 0; j < LANGS.length; j++) {
      if (LANGS[j].code.toLowerCase().split("-")[0] === base) {
        return LANGS[j].code;
      }
    }
  }
  return "";
}

function buildIssueUrl(key, lang) {
  var url = "https://github.com/SilentGameTeams/feedback/issues/new?template=" + encodeURIComponent(templateFor(key, lang));
  if (selectedProject) {
    url += "&title=" + encodeURIComponent("[" + selectedProject.name + "] ");
  }
  return url;
}

function loadProjects() {
  fetch("projects.json", { cache: "no-store" })
    .then(function (response) {
      if (!response.ok) {
        throw new Error("projects.json " + response.status);
      }
      return response.json();
    })
    .then(function (data) {
      projects = Array.isArray(data.projects) ? data.projects : [];
      if (!projects.length) {
        return;
      }
      var all = document.createElement("option");
      all.value = "";
      all.textContent = "全部项目 / All projects";
      projectSelect.appendChild(all);
      for (var i = 0; i < projects.length; i++) {
        var option = document.createElement("option");
        option.value = projects[i].slug;
        option.textContent = projects[i].name;
        projectSelect.appendChild(option);
      }
      projectRow.hidden = false;
    })
    .catch(function () {
      projectRow.hidden = true;
    });
}

projectSelect.addEventListener("change", function () {
  selectedProject = null;
  for (var i = 0; i < projects.length; i++) {
    if (projects[i].slug === projectSelect.value) {
      selectedProject = projects[i];
      break;
    }
  }
  if (currentLanguageCode) {
    showLanguage(currentLanguageCode, true);
  }
});

function renderLanguages() {
  var suggested = browserLanguage();
  for (var i = 0; i < LANGS.length; i++) {
    (function (lang, index) {
      var link = document.createElement("a");
      link.className = "lang";
      link.href = "#" + lang.code;
      link.textContent = lang.name;
      link.style.setProperty("--i", index);
      if (lang.code === suggested) {
        link.classList.add("suggested");
      }
      grid.appendChild(link);
    })(LANGS[i], i);
  }
}

function showLanguage(code, instant) {
  var lang = findLanguage(code);
  if (!lang) {
    showPicker(instant);
    return;
  }
  var ui = UI[lang.code] || UI.en;
  document.documentElement.lang = lang.code;
  document.documentElement.dir = lang.dir;
  document.title = lang.name + " · Silent Game Feedback";
  currentLanguageCode = lang.code;
  currentLanguage.textContent = lang.name;
  chooseType.textContent = ui.chooseType;
  changeButton.textContent = ui.change;
  noteText.textContent = ui.note;
  pickerLink.textContent = ui.picker;
  guideLink.textContent = ui.guide;
  securityText.textContent = ui.security;
  cards.textContent = "";
  for (var i = 0; i < order.length; i++) {
    var key = order[i];
    var item = lang.categories[key];
    var link = document.createElement("a");
    link.className = "card";
    link.style.setProperty("--i", i);
    link.href = buildIssueUrl(key, lang);
    var title = document.createElement("h3");
    var icon = document.createElement("span");
    icon.className = "card-icon";
    icon.style.setProperty("--card-icon", "url(assets/icons/" + key + ".svg)");
    var titleText = document.createElement("span");
    titleText.textContent = item.title;
    title.appendChild(icon);
    title.appendChild(titleText);
    var desc = document.createElement("p");
    desc.textContent = item.desc;
    var arrow = document.createElement("span");
    arrow.className = "arrow";
    arrow.textContent = lang.dir === "rtl" ? "←" : "→";
    link.appendChild(title);
    link.appendChild(desc);
    link.appendChild(arrow);
    cards.appendChild(link);
  }
  switchView(content, instant);
}

function showPicker(instant) {
  var ui = UI["zh-CN"];
  document.documentElement.lang = "zh-CN";
  document.documentElement.dir = "ltr";
  document.title = "Silent Game Feedback · 反馈入口";
  chooseType.textContent = ui.chooseType;
  changeButton.textContent = ui.change;
  noteText.textContent = ui.note;
  pickerLink.textContent = ui.picker;
  guideLink.textContent = ui.guide;
  securityText.textContent = ui.security;
  switchView(pickerView, instant);
}

function switchView(next, instant) {
  if (next === currentView) {
    return;
  }
  var current = currentView;
  currentView = next;
  if (instant || prefersReducedMotion) {
    current.classList.remove("is-active", "is-leaving");
    current.hidden = true;
    next.hidden = false;
    next.classList.add("is-active");
    window.scrollTo(0, 0);
    return;
  }
  startLoading();
  current.classList.remove("is-active");
  current.classList.add("is-leaving");
  setTimeout(function () {
    current.classList.remove("is-leaving");
    current.hidden = true;
    next.hidden = false;
    next.classList.add("is-active");
    finishLoading();
    window.scrollTo(0, 0);
  }, 170);
}

function startLoading() {
  if (!progress) {
    return;
  }
  if (progressTimer) {
    clearTimeout(progressTimer);
    progressTimer = null;
  }
  progress.style.transition = "none";
  progress.style.width = "0%";
  progress.style.opacity = "1";
  progress.offsetWidth;
  progress.style.transition = "width 260ms ease, opacity 160ms ease";
  progress.style.width = "68%";
}

function finishLoading() {
  if (!progress) {
    return;
  }
  progress.style.width = "100%";
  progressTimer = setTimeout(function () {
    progress.style.opacity = "0";
    progressTimer = setTimeout(function () {
      progress.style.width = "0%";
    }, 180);
  }, 160);
}

function route(instant) {
  var code = window.location.hash.replace("#", "");
  if (code) {
    showLanguage(code, instant);
  } else {
    showPicker(instant);
  }
}

changeButton.addEventListener("click", function () {
  if (window.location.hash) {
    window.location.hash = "";
  } else {
    route(false);
  }
});
window.addEventListener("hashchange", function () {
  route(false);
});

renderLanguages();
loadProjects();
route(true);
</script>
</body>
</html>
